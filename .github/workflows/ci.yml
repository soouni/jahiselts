name: Kontrollid
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    name: TypeScript, Vite ja testid
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Paigalda sõltuvused
        run: npm ci
      - name: Käivita ühiktestid
        run: npm test
      - name: Kontrolli TypeScripti ja ehita rakendus
        run: npm run build
