name: Weekly Supabase backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database dump and GeoJSON exports
        run: |
          set -euo pipefail

          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dir="backup-$stamp"
          mkdir "$dir"

          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file "$dir/database.dump"

          pg_dump "$SUPABASE_DB_URL" \
            --schema-only \
            --no-owner \
            --no-privileges \
            --file "$dir/schema.sql"

          export_geojson() {
            table="$1"
            file="$2"

            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "
              select jsonb_build_object(
                'type', 'FeatureCollection',
                'features', coalesce(jsonb_agg(
                  jsonb_build_object(
                    'type', 'Feature',
                    'geometry', ST_AsGeoJSON(geom)::jsonb,
                    'properties', to_jsonb(t) - 'geom'
                  )
                ), '[]'::jsonb)
              )
              from public.${table} t
              where deleted_at is null;
            " > "$dir/$file"
          }

          export_geojson map_objects map_objects.geojson
          export_geojson observations observations.geojson
          export_geojson sign_reports sign_reports.geojson

          # Tühi või liiga väike fail ei tohi saada „õnnestunud” varukoopiaks.
          for file in database.dump schema.sql map_objects.geojson observations.geojson sign_reports.geojson; do
            test -s "$dir/$file" || { echo "Varukoopia fail puudub või on tühi: $file" >&2; exit 1; }
          done
          test "$(wc -c < "$dir/database.dump")" -gt 10000 || { echo "database.dump on kahtlaselt väike" >&2; exit 1; }
          grep -q 'CREATE TABLE' "$dir/schema.sql" || { echo "schema.sql ei sisalda tabeleid" >&2; exit 1; }

          # Arhiiv peab olema loetav ja sisaldama peamiste tabelite andmeid (pg_restore --list ei vaja andmebaasi).
          tables="$(pg_restore --list "$dir/database.dump" | awk '$4=="TABLE" && $5=="DATA" && $6=="public" {print $7}')"
          for t in hunts memberships map_objects observations sign_reports; do
            echo "$tables" | grep -qx "$t" || { echo "database.dump ei sisalda tabeli $t andmeid" >&2; exit 1; }
          done

          tar -czf "$dir.tar.gz" "$dir"

          # Võtme tüüp ilma väärtust avaldamata, et vale võtit oleks logist näha.
          key="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '[:space:]"'"'"'')"
          case "$key" in
            sb_secret_*) kind="sb_secret (uus Secret key)" ;;
            sb_publishable_*) kind="sb_publishable (AVALIK võti, sobimatu: vaja on Secret key)" ;;
            eyJ*.*.*) kind="JWT (vana service_role või anon)" ;;
            *) kind="tundmatu kuju" ;;
          esac
          echo "SUPABASE_SERVICE_ROLE_KEY tüüp: $kind, pikkus ${#key}"
          echo "SUPABASE_URL host: $(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#/.*$##')"

          # Uued `sb_` võtmed ei ole JWT-d ega kuulu Authorization päisesse;
          # vanad JWT võtmed vajavad seda.
          auth=(-H "apikey: $key")
          case "$key" in
            sb_*) ;;
            *) auth+=(-H "Authorization: Bearer $key") ;;
          esac

          curl --fail-with-body \
            -X POST "$SUPABASE_URL/storage/v1/object/backups/$dir.tar.gz" \
            "${auth[@]}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$dir.tar.gz"

      - name: Teata ebaõnnestumisest
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Varukoopia ebaõnnestus"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Uuesti ebaõnnestus ($(date -u +%F)): $url"
          else
            gh issue create --title "$title" --body "Nädalane Supabase'i varukoopia ebaõnnestus: $url

          Järgmised sammud on dokumendis docs/backups.md (jaotis \"Kui töö ebaõnnestub\"). Selle teate sulgemine ei tee midagi, kuid uus ebaõnnestumine lisab siia kommentaari."
          fi
