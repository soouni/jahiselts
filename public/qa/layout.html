<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jahikaardi ekraanisuuruste kontroll</title>
<style>body{font:15px system-ui;margin:20px;background:#eef3ef;color:#173e32}label,select{font:inherit}select{padding:8px;margin:8px}iframe{display:block;border:2px solid #173e32;background:white;margin-top:16px;max-width:none}p{max-width:750px;line-height:1.5}main{overflow:auto;max-width:100%}</style>
<h1>Ekraanisuuruste kontroll</h1><p>See vaade kuvab päris rakenduse valitud mõõtmetega raamis. See kontrollib paigutust samas brauseris; Safari, Androidi, GPS-i, klaviatuuri ja ekraani turvaalade teste tuleb teha ka päris seadmes.</p>
<label>Ekraanisuurus<select id="size"><option value="320,568">Väike telefon · 320 × 568</option><option value="390,844">Telefon · 390 × 844</option><option value="740,360">Telefon külili · 740 × 360</option><option value="768,1024">Tahvel · 768 × 1024</option><option value="1024,768">Tahvel külili · 1024 × 768</option><option value="1366,768">Sülearvuti · 1366 × 768</option></select></label><main><iframe id="app" title="Testitav jahikaart" src="../" width="320" height="568"></iframe></main>
<script>const size=document.querySelector('#size'),app=document.querySelector('#app');size.addEventListener('change',()=>{const [width,height]=size.value.split(',');app.width=width;app.height=height;});</script></html>
